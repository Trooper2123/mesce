# TestSprite test plan — MESCE v2.0 — 12/11/2026
# Modelo: useCases -> useCase/slug/testCases -> id/priority/name/description/steps.
# Uma string em steps é ação; um objeto com chave assert verifica o resultado.
# Credenciais e URL de Preview devem ser configuradas no executor, nunca neste YAML.
# Estado inicial de todos os casos ativos: A EXECUTAR. Este arquivo não registra execução.
# 53 casos ativos; 14 futuros comentados ao final para impedir execução prematura.
# A ausência de chaves enabled/skip/status é intencional: não fazem parte do modelo anexado.
# Preparação: coordenador C e ministros fictícios A/B ativos, L1/L2/L3 ativas, L4 inativa,
# assistidos sintéticos de equipe 1 e 3, duas missas sobrepostas, visita dominical,
# série de 3 ocorrências com exceção, escala V1 publicada e revisão V2, CSVs sintéticos.
# Datas: T=execução em America/Sao_Paulo, M1=próximo mês, M2=seguinte, domingos reais.
# Não executar inclusões em datas fixas que já passaram. Não alterar dados de produção.
# Prazo dia 25 exige relógio controlado; iOS/Android/PDF podem exigir executor manual.
# Não exigir RSVP/presença. Preferência futura: assinatura pessoal mensal + push consolidado.
# Passos destrutivos atuam SOMENTE nas fixtures de teste e exigem restauração/preparação por caso.
# Prioridade: P0/P1 do plano -> High; P2 -> Medium, conforme enum do modelo.

useCases:
  - useCase: Acesso, perfis e autorização
    slug: PERM
    testCases:
      - id: AUTH-01
        priority: High
        name: Entrar e alternar entre coordenador e ministros A/B
        description:
          Caso AUTH-01 do plano MESCE v2.0. Usar apenas fixtures fictícias independentes, datas futuras de
          M1/M2 em America/Sao_Paulo e evidência do commit exato. Quando o passo alternar C/A/B, usar Trocar visão explicitamente
          e confirmar a faixa do perfil antes de agir.
        steps:
          - Iniciar sessão de navegador isolada; não reutilizar o papel de outro teste.
          - Abrir /acesso-dev na URL de Preview configurada no projeto TestSprite.
          - No seletor Perfil para homologar, selecionar Coordenador.
          - Preencher Senha de homologação com a credencial de teste fornecida de forma segura ao executor, sem gravá-la
            neste arquivo.
          - Clicar em Entrar no Preview.
          - assert: Verificar que a faixa de homologação identifica Coordenador e que a página carregou sem erro.
          - Entrar por /acesso-dev, selecionar cada perfil e trocar pela faixa superior.
          - assert: Papel e menu correspondem à escolha; A/B têm IDs distintos e não recebem privilégios administrativos.
      - id: AUTH-02
        priority: High
        name: Negar operações administrativas ao ministro
        description:
          Caso AUTH-02 do plano MESCE v2.0. Usar apenas fixtures fictícias independentes, datas futuras de
          M1/M2 em America/Sao_Paulo e evidência do commit exato.
        steps:
          - Iniciar sessão de navegador isolada; não reutilizar o papel de outro teste.
          - Abrir /acesso-dev na URL de Preview configurada no projeto TestSprite.
          - No seletor Perfil para homologar, selecionar Ministro de teste A.
          - Preencher Senha de homologação com a credencial de teste fornecida de forma segura ao executor, sem gravá-la
            neste arquivo.
          - Clicar em Entrar no Preview.
          - assert: Verificar que a faixa de homologação identifica Ministro de teste A e que a página carregou sem erro.
          - Abrir /locais, /configuracao, /pre-cadastros e tentar enviar uma ação administrativa diretamente.
          - assert: Negativa no servidor, sem gravação; esconder menu não é o único controle.
      - id: AUTH-03
        priority: High
        name: Proteger identidade e cadastro de outro ministro
        description:
          Caso AUTH-03 do plano MESCE v2.0. Usar apenas fixtures fictícias independentes, datas futuras de
          M1/M2 em America/Sao_Paulo e evidência do commit exato.

          - Clicar em Entrar no Preview.
          - assert: Verificar que a faixa de homologação identifica Coordenador e que a página carregou sem erro.
          - C revoga/inativa A; A tenta ação já aberta; trocar novamente para A e depois B.
          - assert: A perde acesso; a troca não restaura cadastro/revogação; B continua independente.
      - id: AUTH-05
        priority: High
        name: Rejeitar sessão expirada, adulterada ou usada em produção
        description:
          Caso AUTH-05 do plano MESCE v2.0. Exige executor/ambiente autorizado para sessão, provedor ou injeção
          de falha; se indisponível, registrar bloqueio de ambiente, nunca aprovação. Usar apenas fixtures fictícias
          independentes, datas futuras de M1/M2 em America/Sao_Paulo e evidência do commit exato.
        steps:
          - Iniciar sessão de navegador isolada; não reutilizar o papel de outro teste.
          - Abrir /acesso-dev na URL de Preview configurada no projeto TestSprite.
          - No seletor Perfil para homologar, selecionar Coordenador.
          - Preencher Senha de homologação com a credencial de teste fornecida de forma segura ao executor, sem gravá-la
            neste arquivo.
          - Clicar em Entrar no Preview.
          - assert: Verificar que a faixa de homologação identifica Coordenador e que a página carregou sem erro.
          - Expirar/adulterar cookie, sair e voltar; verificar modo de teste com configuração Production em ambiente seguro.
          - Executar o ensaio Production somente em ambiente de teste controlado; não alterar variáveis nem cookies de
            produção real.
          - assert:
              Sessão inválida exige login; cookie de Preview não funciona em Production e o seletor não é disponibilizado
              lá.
      - id: AUTH-06
        priority: High
        name: Validar origem, callback Auth0 e allowlist
        description:
          Caso AUTH-06 do plano MESCE v2.0. Exige executor/ambiente autorizado para sessão, provedor ou injeção
          de falha; se indisponível, registrar bloqueio de ambiente, nunca aprovação. Usar apenas fixtures fictícias
          independentes, datas futuras de M1/M2 em America/Sao_Paulo e evidência do commit exato.
        steps:
          - Usar ambiente de ensaio Auth0 autorizado e identidades de teste; não usar bypass de Preview como evidência
            deste caso.
          - Iniciar login por origem alternativa de produção em ensaio autorizado; verificar origem canônica/callback;
            testar identidade fora da allowlist.
          - assert:
              Transação mantém origem/cookie; state/PKCE preservados; usuário não autorizado não ganha acesso. Não
              usar sessão Preview como evidência deste teste.
      - id: AUTH-07
        priority: High
        name: Preservar dados ao alternar perfis de homologação
        description:
          Caso AUTH-07 do plano MESCE v2.0. Usar apenas fixtures fictícias independentes, datas futuras de
